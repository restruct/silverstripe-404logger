---
Name: 404logger_extensions
---
SilverStripe\Control\RequestHandler:
  extensions:
    - FourOhFourLogger
---
Name: 404logger_searchlogging
# silverstripe/cms is suggested, not required: only apply the search logger when SiteTree exists.
Only:
  classexists: SilverStripe\CMS\Model\SiteTree
---
SilverStripe\CMS\Model\SiteTree:
  extensions:
    - SearchQueryLogger
---
Name: 404logger_ignorelist
# silverstripe/siteconfig is suggested, not required: the CMS-editable ignore list for 404s lives
# on SiteConfig (FourOhFourIgnoreListExtension) only when it is installed.
Only:
  classexists: SilverStripe\SiteConfig\SiteConfig
---
SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - FourOhFourIgnoreListExtension
